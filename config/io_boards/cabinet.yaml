# ------------------------------------------------------------------
# I/O board — FP-I/O-0024 — 24 switches / 8 drivers. Cabinet-mounted: flipper buttons, start, coin, service, slam tilt.
# Every switch/coil wired to this specific board lives in this file —
# one file per physical board, instead of one giant machine-wide
# switches.yaml/coils.yaml — so working on this board's wiring means
# opening just this file. Just like the machine-wide files this
# replaces, EVERY entry below ships commented out — uncomment (delete
# the leading "# ") each device you actually built here, and double
# check the "number:" line matches the port you wired it to.
# ------------------------------------------------------------------

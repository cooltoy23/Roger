#config_version=6
# ------------------------------------------------------------------
# Expansion board — Neuron controller's own built-in LED expansion (FP-EXP-2000) — 4 onboard LED ports. Nothing extra to buy; part of the Neuron itself. (Per-port capacity here assumes 32 RGB positions/port, matching FAST's external EXP boards — not separately confirmed for the Neuron's onboard ports in FAST's docs, so double check against your firmware if you push this hard.)
# Expansion boards carry lights (and, on some models, servos) only —
# switches and coils always live on the I/O-board loop in
# config/io_boards/, never here. Every entry below ships commented out
# on purpose, just like the io_boards files — uncomment what you
# actually built, and double check the "number:" line (board label-
# port-position) matches the LED you wired. Default color order is rgb;
# add "type: grb" (or whatever matches your strip) per entry if needed.
# ------------------------------------------------------------------
